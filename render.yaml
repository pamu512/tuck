services:
  - type: web
    name: guided-memory-lane
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QLOO_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
